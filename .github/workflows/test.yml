name: 🧪 Test
run-name: 🧪 Test (${{ github.event.pull_request.title || github.ref_name }})
env:
  MINIMUM_VERSION: 2019.4
  EXCLUDE_FILTER: (2017|2018|2023.3)
  PROJECT_PATH: .
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  setup:
    name: ⚙️ Setup
    runs-on: ubuntu-latest
    outputs:
      unityVersions: ${{ steps.setup.outputs.unityVersions }}
    steps:
    - name: ⚙️ Find target Unity versions
      id: setup
      run: |
        echo "==== Target Unity Versions ===="
        LATEST_VERSIONS=`npx unity-changeset@latest list --versions --latest-patch --min ${MINIMUM_VERSION} --json --all`
        if [ "${{ inputs.usePeriodVersions }}" = "true" ]; then
          ADDITIONAL_VERSIONS=`npx unity-changeset list --versions --grep '0f' --min ${MINIMUM_VERSION} --json`
        else
          ADDITIONAL_VERSIONS=[]
        fi

        VERSIONS=`echo "[${LATEST_VERSIONS}, ${ADDITIONAL_VERSIONS}]" \
          | jq -c '[ flatten | sort | unique | .[] | select( test("${{ env.EXCLUDE_FILTER }}") | not ) ]'`
        echo "unityVersions=${VERSIONS}" | tee $GITHUB_OUTPUT
  test:
    name: 🧪 Run tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    needs: setup
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        unityVersion: ${{ fromJson(needs.setup.outputs.unityVersions) }}
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-checkout probe"
        HEAD_SHA='${{ toJSON(github.event.pull_request.head.sha) }}'
        BASE_SHA='${{ toJSON(github.event.pull_request.base.sha) }}'
        PROJECT_PATH_PR='${{ toJSON(env.PROJECT_PATH) }}'
        printf 'GERALT_DBG event_name=%s\n' "${GITHUB_EVENT_NAME:-unknown}"
        printf 'GERALT_DBG repo=%s\n' "${GITHUB_REPOSITORY:-unknown}"
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG base_sha=%s\n' "$BASE_SHA"
        printf 'GERALT_DBG project_path=%s\n' "$PROJECT_PATH_PR"
      continue-on-error: true
    - name: 🚚 Checkout pull request (pull_request_target)
      if: github.event_name == 'pull_request_target'
      uses: actions/checkout@v5.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: 🚚 Marge pull request (pull_request_target)
      if: github.event_name == 'pull_request_target'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git rebase ${{ github.event.pull_request.base.sha }}
        git log --oneline -n 10
    - name: 📥 Cache library
      uses: actions/cache@v4
      with:
        path: ${{ env.PROJECT_PATH }}/Library
        key: ${{ env.PROJECT_PATH }}-Library-${{ matrix.unityVersion }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          ${{ env.PROJECT_PATH }}-Library-${{ matrix.unityVersion }}-
          ${{ env.PROJECT_PATH }}-Library-
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-build sink probe"
        printf 'GERALT_DBG project_path=%s\n' "${PROJECT_PATH:-<unset>}"
        if [ -d "${PROJECT_PATH:-.}" ]; then
          echo "GERALT_DBG project dir listing:"
          ls -la "${PROJECT_PATH:-.}" 2>/dev/null | head -n 25 || true
        else
          echo "GERALT_DBG project dir missing: ${PROJECT_PATH:-.}"
        fi
        if [ -f "${PROJECT_PATH:-.}/ProjectSettings/ProjectVersion.txt" ]; then
          echo "GERALT_DBG ProjectVersion.txt present:"
          head -n 5 "${PROJECT_PATH:-.}/ProjectSettings/ProjectVersion.txt" 2>/dev/null || true
        else
          echo "GERALT_DBG ProjectVersion.txt absent"
        fi
        echo "GERALT_DBG git HEAD:"
        git log --oneline -n 3 2>/dev/null || echo "GERALT_DBG git log unavailable"
      continue-on-error: true
    - name: 🛠️ Build Unity Project (Test)
      uses: game-ci/unity-builder@main
      timeout-minutes: 45
      with:
        customImage: ghcr.io/mob-sakai/unity3d:${{ matrix.unityVersion }}
        targetPlatform: StandaloneLinux64
        allowDirtyBuild: true
        customParameters: -nographics
        projectPath: ${{ env.PROJECT_PATH }}
      env:
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-test-runner sink probe"
        printf 'GERALT_DBG project_path=%s\n' "${PROJECT_PATH:-<unset>}"
        if [ -d "${PROJECT_PATH:-.}/Assets" ]; then echo "GERALT_DBG Assets present"; else echo "GERALT_DBG Assets absent"; fi
        if [ -f "${PROJECT_PATH:-.}/ProjectSettings/ProjectVersion.txt" ]; then echo "GERALT_DBG ProjectVersion.txt present"; else echo "GERALT_DBG ProjectVersion.txt absent"; fi
        git log --oneline -n 3 2>/dev/null || echo "GERALT_DBG git log unavailable"
      continue-on-error: true
    - name: 🧪 Run tests
      uses: game-ci/unity-test-runner@v4
      timeout-minutes: 45
      with:
        customImage: ghcr.io/mob-sakai/unity3d:${{ matrix.unityVersion }}
        customParameters: -nographics
        checkName: ${{ matrix.unityVersion }} Test Results
        githubToken: ${{ github.token }}
        projectPath: ${{ env.PROJECT_PATH }}
      env:
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
on:
  workflow_dispatch:
    inputs:
      usePeriodVersions:
        description: Use the period versions (.0f1, .10f1, 20f1, ...).
        required: false
        default: 'true'
  push:
    branches:
    - develop
    - develop-*
    tags:
    - '!*'
    paths-ignore:
    - '**.md'
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    paths-ignore:
    - '**.md'
